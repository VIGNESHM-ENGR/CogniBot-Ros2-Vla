repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=2048]
        # Vendored MuJoCo Menagerie meshes are upstream files kept byte-identical.
        exclude: ^cognibot_ws/src/cognibot_sim/robots/[^/]+/mjcf/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
