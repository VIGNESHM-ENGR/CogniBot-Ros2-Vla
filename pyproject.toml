# Repository-wide tool configuration only (ROS packages keep their own setup.py).
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cognibot_ws/build", "cognibot_ws/install", "cognibot_ws/log", "cognibot_ws/src/third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
