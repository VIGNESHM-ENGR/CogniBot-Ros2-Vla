name: so101
base_frame: base_link
ee_frame: gripper_frame_link
ee_site: gripperframe
arm_joints:
  - shoulder_pan
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - wrist_roll
gripper:
  joint: gripper
  open: 1.2
  closed: 0.0
home_pose:
  - 0.0
  - -1.57
  - 1.57
  - 0.0
  - 0.0
mjcf:
  scene: scenes/so101_pick_and_place.xml
  ik_model: robots/so101/mjcf/so101_ik_spheres.xml
  # Printed-part materials recolored by sim.launch.py robot_color (motors stay black).
  tint_materials:
    - base_motor_holder_so101_v1_material
    - base_so101_v2_material
    - waveshare_mounting_plate_so101_v2_material
    - motor_holder_so101_base_v1_material
    - rotation_pitch_so101_v1_material
    - upper_arm_so101_v1_material
    - under_arm_so101_v1_material
    - motor_holder_so101_wrist_v1_material
    - wrist_roll_pitch_so101_v2_material
    - wrist_roll_follower_so101_v1_material
    - moving_jaw_so101_v1_material
urdf: robots/so101/urdf/so101_mujoco.urdf.xacro
controllers: robots/so101/config/controllers.yaml
moveit:
  config_package: so101_moveit_config
  kinematics_override: config/so101/kinematics_pick_ik.yaml
cameras:
  front:
    topic: /camera/front
    frame: front_camera_optical_frame
    depth: true
  wrist:
    topic: /camera/wrist
    frame: wrist_camera_optical_frame
    depth: false
safety:
  collision_spheres: config/so101/collision_spheres.yaml
  min_distance: 0.01
  max_joint_velocity: 2.0
reach:
  study_dir: config/so101/reach/
  workspace_sphere:
    center:
      - 0.0
      - 0.0
      - 0.12
    r_min: 0.08
    r_max: 0.38
vla:
  lerobot_robot_type: cognibot_so101
  checkpoint: lerobot/smolvla_base
