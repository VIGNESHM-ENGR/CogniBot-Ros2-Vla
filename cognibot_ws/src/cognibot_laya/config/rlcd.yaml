laya_decision:
  ros__parameters:
    robot: so101
    # Decision model (ADR-0008). `auto` routes by script and language: the English checkpoint
    # collapses off English (0.100 on Hindi 20-option intent, at high confidence).
    model: auto
    device: cuda          # 33 ms per decision on the RTX 3060; cpu ≈ 0.8 s, 0 MiB VRAM
    # One checkpoint resident (~0.85 GB fp16) so the full profile still fits 6 GB beside the VLM;
    # a non-English task swaps in the multilingual one on first use (~7 s).
    preload: true
    max_loaded: 1
    # Pinned snapshot inside the mounted HF cache (docker/laya/download_checkpoints.sh).
    snapshot_dir: /hf_cache/hub/models--convaiinnovations--laya/snapshots/1c5edc17a7acd8701df6fc341c0d179f1c62c982
    # Track A: below this calibrated confidence a skill decision escalates instead of moving.
    min_confidence: 0.35
    # Track B: no confidence gate. Measured, 23/24 of its moves close the gap while right answers
    # carry confidence as low as 0.06; the stall watchdog stops a run that stops closing in.
    primitive_min_confidence: 0.0
    max_stall_steps: 4
    # Identical skill on an unchanged scene before Track A stops (one retry allowed).
    max_repeats: 1
    guard_enabled: true
    guard_threshold: 0.6
    max_steps: 12
    max_primitive_steps: 90
    max_duration_s: 300.0
    # Track B: the model picks one motion per step; the stage (approach, grasp, lift, carry,
    # lower, release, retreat) and the cube's state are read from the simulator's poses.
    step_m: 0.025             # longest single motion
    teleop_speed: 0.1         # = mink_teleop max_linear_speed
    hover_m: 0.06             # approach and lift height above the grasp and drop points
    # The gripper frame is 2 cm outboard of the jaw centre (pick_place_ik.GRASP_OFFSET).
    grasp_offset_m: 0.02
    # A jog that moves the gripper less than this is blocked for the next decision.
    min_jog_m: 0.005
    # Tool pointing down, gripper frame at (0.255, 0, 0.072): teleop keeps this orientation.
    # Solved with pick_place_ik.solve_from_seeds for a point 6 cm above a grasp at r = 0.25 m.
    ready_pose: [0.0, 0.29, -0.36, 1.64, 0.0]
    # Black rectangle inner half size (arena zone: inner x 0.1925-0.2925, y -0.10..0.10).
    target_half_extents: [0.050, 0.100]
    object_topic: /object_poses/free_joint_states
    cube_half_height: 0.015
    # The cube spawner parks unused bodies at x = -0.55; they are not part of the scene.
    min_object_x: 0.0
    static_objects: ["target|black rectangle|0.2425|0.0|0.002"]
