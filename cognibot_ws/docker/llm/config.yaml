# llama-swap configuration: one Qwen3-VL-4B model exposed as three VRAM profiles.
# Only one profile is loaded at a time (swap group). See docs/VRAM_BUDGET.md §3.
# Tuning and verification: P4-T02.
healthCheckTimeout: 300
logLevel: info
startPort: 5800
globalTTL: 120

# Files come from cognibot_ws/docker/llm/download_model.sh (HF cache mounted at /hf_cache);
# `-hf` downloading inside llama-server was abandoned because llama-swap's health check kills
# the server before a 2.5 GB download finishes.
macros:
  snapshot: /hf_cache/hub/models--Qwen--Qwen3-VL-4B-Instruct-GGUF/snapshots/1cd86afb9a95c410a6038ab3b40d8b578c892266
  qwen_common: >-
    --host 127.0.0.1 --port ${PORT}
    -m ${snapshot}/Qwen3VL-4B-Instruct-Q4_K_M.gguf
    --mmproj ${snapshot}/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
    --jinja -c 4096 -np 1
    --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn on

models:
  qwen3-vl-4b-gpu:
    name: "Qwen3-VL-4B (all layers on GPU)"
    capabilities:
      tools: true
    cmd: llama-server ${qwen_common} -ngl 99
  qwen3-vl-4b-hybrid:
    name: "Qwen3-VL-4B (16 layers on GPU, rest in RAM)"
    capabilities:
      tools: true
    cmd: llama-server ${qwen_common} -ngl 16
  qwen3-vl-4b-cpu:
    name: "Qwen3-VL-4B (CPU/RAM only)"
    capabilities:
      tools: true
    cmd: llama-server ${qwen_common} -ngl 0 --no-mmproj-offload -t 6

groups:
  qwen3-vl:
    swap: true
    exclusive: true
    members: [qwen3-vl-4b-gpu, qwen3-vl-4b-hybrid, qwen3-vl-4b-cpu]
