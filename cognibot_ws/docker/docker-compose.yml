# CogniBot-ROS2-VLA stack. Profiles: (none)=core sim stack · vlm · vla · twin · full
#   make sim | make vlm | make vla | make full | make twin
# Networking and ports: docs/NETWORKING.md · VRAM/RAM limits: docs/VRAM_BUDGET.md
name: cognibot

x-ros: &ros
  network_mode: host
  ipc: host
  init: true
  restart: unless-stopped
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    CYCLONEDDS_URI: file:///etc/cognibot/cyclonedds.xml
    ROBOT: ${ROBOT:-so101}
    PYTHONPATH: /opt/venv/lib/python3.12/site-packages

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, compute, utility, graphics]

x-build-args: &build-args
  HOST_UID: ${HOST_UID:-1000}
  HOST_GID: ${HOST_GID:-1000}

x-core-build: &core-build
  context: ../..
  dockerfile: cognibot_ws/docker/Dockerfile
  target: core
  args: *build-args

services:
  # ─────────────── core (always on) ───────────────
  sim:
    <<: [*ros, *gpu]
    image: cognibot/core:${COGNIBOT_VERSION:-dev}
    build: *core-build
    command: ros2 launch cognibot_bringup sim.launch.py robot:=${ROBOT:-so101} robot_color:=${ROBOT_COLOR:-red} headless:=true
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "/entrypoint.sh ros2 control list_controllers | grep -q 'joint_state_broadcaster.*active'"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s

  motion:
    <<: *ros
    image: cognibot/core:${COGNIBOT_VERSION:-dev}
    build: *core-build
    command: ros2 launch cognibot_bringup motion.launch.py robot:=${ROBOT:-so101}
    mem_limit: 3g
    depends_on:
      sim:
        condition: service_healthy

  bridge:
    <<: *ros
    image: cognibot/core:${COGNIBOT_VERSION:-dev}
    build: *core-build
    command: ros2 launch cognibot_bringup bridge.launch.py
    mem_limit: 1g
    depends_on:
      sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9090'"]
      interval: 10s
      timeout: 3s
      retries: 6

  dashboard:
    image: cognibot/dashboard:${COGNIBOT_VERSION:-dev}
    build:
      context: ../..
      dockerfile: cognibot_ws/docker/dashboard.Dockerfile
    ports:
      - "127.0.0.1:8000:80"
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy

  # ─────────────── vlm profile ───────────────
  llm:
    <<: *gpu
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda13
    profiles: [vlm, full]
    network_mode: host
    restart: unless-stopped
    environment:
      LLAMA_SWAP_CONFIG: /etc/llama-swap/config/config.yaml
      LLAMA_SWAP_LISTEN: 127.0.0.1:8082
      LLAMA_SWAP_WATCH_CONFIG: "false"
      LLAMA_CACHE: /models/cache
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./llm/config.yaml:/etc/llama-swap/config/config.yaml:ro
      - llm_models:/models
    mem_limit: 12g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  vlm-agent:
    <<: *ros
    image: cognibot/vlm:${COGNIBOT_VERSION:-dev}
    build:
      context: ../..
      dockerfile: cognibot_ws/docker/Dockerfile
      target: vlm
      args: *build-args
    profiles: [vlm, full]
    command: ros2 launch cognibot_bringup vlm.launch.py robot:=${ROBOT:-so101}
    environment:
      <<: *ros-env
      LLM_BASE_URL: http://127.0.0.1:8082/v1
      LLM_MODEL: ${LLM_MODEL:-qwen3-vl-4b-gpu}
    mem_limit: 2g
    depends_on:
      llm:
        condition: service_healthy
      motion:
        condition: service_started

  # ─────────────── vla profile ───────────────
  policy-server:
    <<: *gpu
    # lerobot 0.6.2 (main, 2026-09-13); async-inference protocol identical to the 0.6.1 client.
    image: ${LEROBOT_GPU_IMAGE:-huggingface/lerobot-gpu@sha256:7f36ab17a87911c79ad0856bdfa2bf0d9b92ce03d677a3ef41a9d91bc659ed6b}
    profiles: [vla, full]
    network_mode: host
    restart: unless-stopped
    # The image runs as uid 1001; run as the host user so it can read and lock the mounted cache.
    # The server writes ./logs, so start from a writable directory.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /tmp
    command: python -m lerobot.async_inference.policy_server --host=127.0.0.1 --port=8090
    environment:
      HF_HOME: /hf_cache
      TORCH_HOME: /hf_cache/torch
      # The image bakes cache paths for its own uid 1001; point them at writable locations.
      HOME: /tmp
      HF_LEROBOT_HOME: /hf_cache/lerobot
      TRITON_CACHE_DIR: /hf_cache/triton  # first SmolVLA run autotunes for ~3 min; keep the result
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      # Host HF cache, filled by cognibot_vla/scripts/download_checkpoints.sh
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/hf_cache
    shm_size: 2g
    mem_limit: 8g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8090), 2)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  vla-client:
    <<: *ros
    image: cognibot/vla:${COGNIBOT_VERSION:-dev}
    build:
      context: ../..
      dockerfile: cognibot_ws/docker/Dockerfile
      target: vla
      args: *build-args
    profiles: [vla, full]
    # Idle by default: a policy takes the arm the moment its client starts, so runs are started
    # explicitly (`make skill ...`, or the skill executor from P5-T06).
    command: sleep infinity
    environment:
      <<: *ros-env
      HOME: /tmp
      POLICY_SERVER_ADDRESS: 127.0.0.1:8090
      POLICY_TYPE: ${POLICY_TYPE:-smolvla}
      # Path as seen by the policy-server (its HF cache is mounted at /hf_cache).
      VLA_CHECKPOINT: ${VLA_CHECKPOINT:-/hf_cache/cognibot/smolvla_mujoco_tray}
      ACTION_DEGREES: ${ACTION_DEGREES:-true}
      STATE_DEGREES: ${STATE_DEGREES:-false}
      CAMERA_TOPICS: "${CAMERA_TOPICS:-{realsense: /mujoco_camera_plugin/front_rgbd/color, wrist_cam: /mujoco_camera_plugin/wrist_cam/color}}"
      TASK: ${TASK:-pick up the cube and place it on the tray}
      LLM_BASE_URL: http://127.0.0.1:8082
    mem_limit: 4g
    depends_on:
      policy-server:
        condition: service_healthy
      motion:
        condition: service_started

  # ─────────────── twin profile ───────────────
  twin:
    <<: *ros
    image: cognibot/core:${COGNIBOT_VERSION:-dev}
    build: *core-build
    profiles: [twin]
    command: ros2 launch cognibot_bringup twin.launch.py hardware_type:=${TWIN_HARDWARE:-mock}
    mem_limit: 1g
    # Enable when a real SO-101 bus adapter is connected (P6-T03):
    # devices:
    #   - ${TWIN_SERIAL_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0
    depends_on:
      sim:
        condition: service_healthy

volumes:
  llm_models:
