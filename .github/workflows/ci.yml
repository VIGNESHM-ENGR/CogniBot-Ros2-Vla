name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/ruff-action@v3
      - name: Commit messages (Conventional Commits, no attribution trailers)
        if: github.event_name == 'pull_request'
        run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > /tmp/msg
            .githooks/commit-msg /tmp/msg
          done

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose for every profile
        run: make config

  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build and test workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd cognibot_ws
          colcon build --event-handlers console_cohesion+
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose
